<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg7)" />
  <g filter="url(#shadow7)" transform="translate(100, 160)">
    <!-- White Minimal Sneakers -->
    <!-- Sole -->
    <path d="M 20 120 Q 110 130 190 120 L 195 138 Q 110 148 15 138 Z" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="2" />
    <!-- Upper leather -->
    <path d="M 20 120 Q 30 70 80 60 Q 120 50 140 80 Q 170 95 190 120 Z" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" />
    <!-- Toe cap & tongue -->
    <path d="M 140 80 L 110 65 L 85 85" fill="none" stroke="#a8a29e" stroke-width="2" />
    <!-- Eyelets & laces -->
    <line x1="95" y1="80" x2="115" y2="72" stroke="#a8a29e" stroke-width="2" />
    <line x1="105" y1="90" x2="125" y2="82" stroke="#a8a29e" stroke-width="2" />
    <line x1="115" y1="100" x2="135" y2="92" stroke="#a8a29e" stroke-width="2" />
    <circle cx="50" cy="95" r="8" fill="none" stroke="#e7e5e4" stroke-width="1.5" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">VEJA</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Minimalist Leather Sneakers</text>
</svg>
