<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />
  <g filter="url(#shadow)" transform="translate(100, 110)">
    <!-- White Oversized Shirt -->
    <path d="M 40 40 L 70 80 L 100 40 L 130 80 L 160 40 L 195 95 L 160 120 L 140 100 L 145 260 L 55 260 L 60 100 L 40 120 L 5 95 Z" fill="#ffffff" stroke="#d6d3d1" stroke-width="2" />
    <!-- Collar & details -->
    <path d="M 70 80 L 100 115 L 130 80" fill="none" stroke="#a8a29e" stroke-width="2" />
    <path d="M 100 115 L 100 260" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="2 12" />
    <circle cx="100" cy="140" r="3" fill="#a8a29e" />
    <circle cx="100" cy="170" r="3" fill="#a8a29e" />
    <circle cx="100" cy="200" r="3" fill="#a8a29e" />
    <circle cx="100" cy="230" r="3" fill="#a8a29e" />
    <rect x="65" y="140" width="22" height="25" rx="3" fill="none" stroke="#e7e5e4" stroke-width="1.5" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">ARKET</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Oversized Cotton Shirt</text>
</svg>
