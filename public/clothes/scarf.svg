<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg10)" />
  <g filter="url(#shadow10)" transform="translate(110, 110)">
    <!-- Silk Scarf (Folded Diamond Shape) -->
    <polygon points="90,20 165,95 90,170 15,95" fill="#d97706" stroke="#b45309" stroke-width="2" />
    <polygon points="90,45 140,95 90,145 40,95" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <polygon points="90,65 120,95 90,125 60,95" fill="#1e3a8a" stroke="#172554" stroke-width="1.5" />
    <circle cx="90" cy="95" r="10" fill="#dc2626" />
    <!-- Borders and hem -->
    <line x1="20" y1="95" x2="160" y2="95" stroke="#78350f" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="90" y1="25" x2="90" y2="165" stroke="#78350f" stroke-width="1" stroke-dasharray="2 2" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">VINTAGE ATELIER</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Printed Silk Carré Scarf</text>
</svg>
