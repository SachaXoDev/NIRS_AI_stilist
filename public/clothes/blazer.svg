<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)" />
  <g filter="url(#shadow2)" transform="translate(100, 100)">
    <!-- Structured Black Blazer -->
    <path d="M 50 30 L 100 70 L 150 30 L 195 85 L 165 110 L 150 95 L 155 270 L 45 270 L 50 95 L 35 110 L 5 85 Z" fill="#1c1917" stroke="#292524" stroke-width="2" />
    <!-- Lapels -->
    <path d="M 50 30 L 85 130 L 100 130 L 65 30 Z" fill="#292524" />
    <path d="M 150 30 L 115 130 L 100 130 L 135 30 Z" fill="#292524" />
    <!-- V neck opening -->
    <path d="M 85 130 L 100 170 L 115 130" fill="none" stroke="#44403c" stroke-width="2" />
    <circle cx="100" cy="185" r="4" fill="#78716c" />
    <circle cx="100" cy="215" r="4" fill="#78716c" />
    <!-- Flap pockets -->
    <rect x="52" y="210" width="34" height="6" rx="2" fill="#292524" />
    <rect x="114" y="210" width="34" height="6" rx="2" fill="#292524" />
    <rect x="60" y="125" width="25" height="4" rx="1" fill="#44403c" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">COS</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Tailored Wool Blazer</text>
</svg>
