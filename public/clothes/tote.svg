<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <filter id="shadow9" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg9)" />
  <g filter="url(#shadow9)" transform="translate(110, 110)">
    <!-- Leather Tote Bag -->
    <!-- Handles -->
    <path d="M 55 90 C 55 10, 125 10, 125 90" fill="none" stroke="#451a03" stroke-width="6" stroke-linecap="round" />
    <!-- Bag body -->
    <path d="M 25 90 L 155 90 L 145 230 L 35 230 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Flap / Stitch details -->
    <path d="M 30 110 L 150 110" stroke="#92400e" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 90 90 L 90 230" stroke="#92400e" stroke-width="1.5" />
    <rect x="80" y="130" width="20" height="15" rx="3" fill="#b45309" stroke="#fef3c7" stroke-width="1" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">POLÈNE</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Textured Leather Tote</text>
</svg>
