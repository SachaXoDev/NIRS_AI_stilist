<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg3)" />
  <g filter="url(#shadow3)" transform="translate(125, 90)">
    <!-- Denim Jeans -->
    <path d="M 15 20 L 135 20 L 145 60 L 135 280 L 85 280 L 75 120 L 65 280 L 15 280 L 5 60 Z" fill="#1e3a8a" stroke="#172554" stroke-width="2" />
    <!-- Waistband & fly -->
    <rect x="15" y="20" width="120" height="18" rx="2" fill="#1d4ed8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 2" />
    <path d="M 75 38 L 75 90" stroke="#ca8a04" stroke-width="2" />
    <circle cx="75" cy="29" r="3.5" fill="#ca8a04" />
    <!-- Rivets & pockets -->
    <path d="M 25 38 Q 45 40 50 65" fill="none" stroke="#ca8a04" stroke-width="1.5" />
    <path d="M 125 38 Q 105 40 100 65" fill="none" stroke="#ca8a04" stroke-width="1.5" />
  </g>
  <text x="200" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#78716c" text-anchor="middle" letter-spacing="1">LEVI'S</text>
  <text x="200" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#a8a29e" text-anchor="middle">Straight High-Rise Denim</text>
</svg>
